<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <aside>
        <h1>Tic Tac Toe</h1>
        <p>Choose your marker:</p>
        <div class="markers">
          <button class="marker X">X</button>
          <button class="marker O">O</button>
        </div>
        <button>Start / Reset Game</button>
      </aside>
      <main>
        <div class="gameboard">
          <button data-row="0" data-cell="0"></button>
          <button data-row="0" data-cell="1"></button>
          <button data-row="0" data-cell="2"></button>
          <button data-row="1" data-cell="0"></button>
          <button data-row="1" data-cell="1"></button>
          <button data-row="1" data-cell="2"></button>
          <button data-row="2" data-cell="0"></button>
          <button data-row="2" data-cell="1"></button>
          <button data-row="2" data-cell="2"></button>
        </div>
      </main>
    </div>
  </body>
</html>
